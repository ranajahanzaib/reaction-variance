name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - run: make install
      - run: make download
      - run: make ingest
      - run: PYTHONPATH=backend backend/.venv/bin/python scripts/verify-example.py
      - run: make test
      - run: make build
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Start local servers and run E2E
        run: |
          make serve > /tmp/backend.log 2>&1 &
          make frontend > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null && curl -fsS http://127.0.0.1:8011/api/health > /dev/null; then break; fi
            sleep 1
          done
          make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
